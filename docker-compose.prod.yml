# Production Docker Compose — Patogh Restaurant Reservation System
#
# Architecture:
#   Internet → nginx (port 80)  → /api/*     → patogh_api:8080
#                               → /uploads/* → patogh_api:8080
#                               → /*         → React SPA (static)
#
#   postgres and redis are internal-only (no published ports).
#   patogh_api is internal-only (accessed only through nginx).
#
# Usage:
#   cp .env.production.example .env.production
#   # fill in .env.production
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

services:

  # ── Database ─────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: patogh_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: Patogh_DB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Patogh_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Cache / OTP store ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: patogh_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── ASP.NET Core API (internal — not exposed publicly) ───────────────────────
  api:
    build:
      context: ./back/patogh
      dockerfile: Dockerfile
    image: patogh-api:prod
    container_name: patogh_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Database
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;Database=Patogh_DB;
        Username=postgres;Password=${POSTGRES_PASSWORD}
      # Redis
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD}"
      # JWT
      JwtSettings__Secret: "${JWT_SECRET}"
      JwtSettings__Issuer: PatoghAPI
      JwtSettings__Audience: PatoghClient
      JwtSettings__ExpirationInMinutes: "60"
      JwtSettings__RefreshTokenExpirationDays: "30"
      # CORS — allow requests from the production domain
      # (same-origin via nginx, but keep list accurate for future mobile/native clients)
      Cors__AllowedOrigins__0: "https://${DOMAIN}"
      Cors__AllowedOrigins__1: "https://www.${DOMAIN}"
      Cors__AllowedOrigins__2: "http://${DOMAIN}"
    volumes:
      - uploads:/app/Uploads
      - logs:/app/logs
      - dataprotection:/app/.aspnet/DataProtection-Keys
    networks:
      - backend   # reaches postgres + redis
      - proxy     # reachable by nginx
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ── Nginx — Frontend SPA + API reverse proxy (only public-facing service) ────
  nginx:
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        # Empty VITE_API_URL → frontend uses relative URLs (/api/...).
        # Nginx proxies /api/* to the backend container.
        VITE_API_URL: ""
        VITE_USE_MOCK: "false"
    image: patogh-nginx:prod
    container_name: patogh_nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - proxy

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  backend:
    driver: bridge
    # postgres + redis are on this network only; nginx cannot reach them directly
  proxy:
    driver: bridge
    # nginx ↔ api traffic

# ── Persistent volumes ────────────────────────────────────────────────────────
volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  uploads:
    driver: local
  logs:
    driver: local
  dataprotection:
    driver: local
