server {
    listen 80;
    server_name _;

    # ── Gzip ────────────────────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml+rss
        application/font-woff application/font-woff2
        image/svg+xml;

    # ── Security headers ─────────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── API reverse proxy ────────────────────────────────────────────────────────
    # All /api/* requests are forwarded to the ASP.NET Core backend.
    location /api/ {
        proxy_pass             http://patogh_api:8080/api/;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade           $http_upgrade;
        proxy_set_header       Connection        "upgrade";
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_cache_bypass     $http_upgrade;
        proxy_read_timeout     300s;
        proxy_connect_timeout  30s;
        proxy_send_timeout     300s;
        # Allow large file uploads (images via MediaController)
        client_max_body_size   20m;
    }

    # ── Uploaded media files ─────────────────────────────────────────────────────
    location /uploads/ {
        proxy_pass           http://patogh_api:8080/uploads/;
        proxy_http_version   1.1;
        proxy_set_header     Host              $host;
        proxy_set_header     X-Real-IP         $remote_addr;
        proxy_set_header     X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header     X-Forwarded-Proto $scheme;
        # Cache uploaded images aggressively on the client side
        expires              7d;
        add_header           Cache-Control "public";
    }

    # ── Health check proxy (for external monitors) ───────────────────────────────
    location /health {
        proxy_pass         http://patogh_api:8080/health;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        access_log         off;
    }

    # ── React SPA ────────────────────────────────────────────────────────────────
    # Serve static files; fall back to index.html so React Router handles routing.
    location / {
        root  /usr/share/nginx/html;
        index index.html;

        # SPA fallback — return index.html for any path not found on disk
        try_files $uri $uri/ /index.html;

        # Cache JS/CSS/images with content-hash filenames indefinitely
        location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
            expires    1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # index.html must never be cached so updates are instant
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }
}
